<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Shield Crest -->
  <path d="M256 64 L416 128 V272 C416 368 256 448 256 448 C256 448 96 368 96 272 V128 Z" 
        fill="#0b1324" stroke="url(#accent)" stroke-width="16" stroke-linejoin="round" />

  <!-- QR Finder Pattern: Top-Left -->
  <rect x="160" y="152" width="60" height="60" rx="8" fill="none" stroke="#34d399" stroke-width="8" />
  <rect x="176" y="168" width="28" height="28" rx="4" fill="#34d399" />

  <!-- QR Finder Pattern: Top-Right -->
  <rect x="292" y="152" width="60" height="60" rx="8" fill="none" stroke="#34d399" stroke-width="8" />
  <rect x="308" y="168" width="28" height="28" rx="4" fill="#34d399" />

  <!-- QR Finder Pattern: Bottom-Left -->
  <rect x="160" y="272" width="60" height="60" rx="8" fill="none" stroke="#34d399" stroke-width="8" />
  <rect x="176" y="288" width="28" height="28" rx="4" fill="#34d399" />

  <!-- Center Shield Lock / Cyber Matrix Core -->
  <circle cx="316" cy="296" r="28" fill="#10b981" />
  <path d="M308 296 L314 302 L326 288" stroke="#020617" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- BAZ Typographic Brand Monogram inside crest -->
  <text x="256" y="396" font-family="-apple-system, system-ui, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">BAZ</text>
</svg>
